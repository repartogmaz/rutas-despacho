<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>KA4V01 · 10-03-2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c:#e63946;--bg:#f5f2eb;--ink:#1a1814;--muted:#8c8680;--surface:#fff;--border:#e2ddd5}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* TOPBAR */
.topbar{background:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:3px solid var(--c)}
.route-badge{background:var(--c);color:#fff;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;padding:4px 10px;border-radius:2px;letter-spacing:.04em;white-space:nowrap}
.topbar-info{flex:1;min-width:0}
.topbar-info h1{font-family:'Unbounded',sans-serif;font-size:13px;color:#fff;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-info p{font-family:'Space Mono',monospace;font-size:9px;color:#888;margin-top:2px}
.counter{font-family:'Space Mono',monospace;font-size:11px;color:var(--c);text-align:right;white-space:nowrap}
.counter span{display:block;font-size:9px;color:#666;margin-top:1px}

/* TABS */
.tabs{display:flex;background:var(--ink);flex-shrink:0;border-bottom:1px solid #333}
.tab{flex:1;padding:8px;text-align:center;font-size:11px;font-weight:600;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.02em}
.tab.active{color:var(--c);border-bottom-color:var(--c)}

/* MAP */
#map{flex:1;display:block}

/* LIST VIEW */
#listView{flex:1;overflow-y:auto;display:none}
.client-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.client-item:active{background:#ece9e0}
.client-num{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.client-name{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:2px}
.client-addr{font-size:12px;color:var(--muted);line-height:1.4}
.client-actions{display:flex;gap:6px;margin-top:6px}
.btn-nav{display:inline-flex;align-items:center;gap:4px;background:var(--c);color:#fff;border:none;border-radius:3px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none}
.btn-call{background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:4px;border:none;border-radius:3px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none}
.client-notas{font-size:11px;color:#c05000;background:#fff8f5;border-left:3px solid var(--c);padding:4px 8px;margin-top:6px;border-radius:0 3px 3px 0}

/* SEARCH */
.search-wrap{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:none}
#searchBox{width:100%;border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:var(--bg)}
#searchBox:focus{border-color:var(--c)}

/* POPUP */
.lp-inner{padding:14px;min-width:200px;max-width:290px}
.lp-badge{display:inline-block;background:var(--c);color:#fff;font-size:9px;font-family:'Space Mono',monospace;padding:2px 6px;border-radius:2px;margin-bottom:6px;letter-spacing:.04em}
.lp-codigo{display:inline-block;background:#f0f0f0;color:#555;font-size:9px;font-family:'Space Mono',monospace;padding:2px 6px;border-radius:2px;margin-bottom:6px;margin-left:4px;letter-spacing:.04em}
.lp-name{font-size:15px;font-weight:700;margin-bottom:3px;line-height:1.3}
.lp-addr{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.lp-horario{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#1a6640;background:#e8f7ee;border-radius:3px;padding:3px 8px;margin-bottom:8px}
.lp-actions{display:flex;gap:6px;flex-wrap:wrap}
.lp-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:3px;font-size:12px;font-weight:600;border:none;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif}
.lp-btn-nav{background:#e63946;color:#fff}
.lp-btn-call{background:#1a1814;color:#fff}
.lp-notas{font-size:11px;color:#c05000;background:#fff8f5;border-left:3px solid #e63946;padding:5px 8px;margin-top:8px;border-radius:0 3px 3px 0;line-height:1.4}
.lp-extras{margin-top:8px;border-top:1px solid #eee;padding-top:8px;display:flex;flex-direction:column;gap:4px}
.lp-extra-row{display:flex;gap:6px;font-size:11px;line-height:1.4}
.lp-extra-label{font-family:'Space Mono',monospace;font-size:9px;color:#888;min-width:70px;padding-top:1px;text-transform:uppercase;letter-spacing:.03em}
.lp-extra-val{font-weight:600;color:#1a1814;flex:1}

/* ENRUTAR BTN */
.btn-enrutar{background:var(--c);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;letter-spacing:.02em}
.btn-enrutar:active{opacity:.8}

/* LEAFLET */
.leaflet-popup-content-wrapper{background:#fff!important;border:none!important;border-radius:8px!important;box-shadow:0 8px 32px rgba(0,0,0,.18)!important;padding:0!important}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-tip-container{display:none}
.leaflet-control-zoom{border:none!important}
.leaflet-control-zoom a{background:var(--ink)!important;color:#fff!important;border:none!important;border-radius:4px!important;margin-bottom:4px!important;font-size:18px!important}
</style>
</head>
<body>

<div class="topbar">
  <div class="route-badge">KA4V01</div>
  <div class="topbar-info">
    <h1>Mapa del día</h1>
    <p>MARTES, 10 DE MARZO DE 2026</p>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
    <div class="counter">11<span>clientes</span></div>
    <button class="btn-enrutar" onclick="openEnrutar()">🗺 Enrutar</button>
  </div>
</div>

<!-- MODAL ENRUTAR -->
<div id="modalEnrutar" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;align-items:flex-end;justify-content:center">
  <div style="background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 20px 32px;max-height:85vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700">Enrutar en Google Maps</div>
        <div style="font-size:11px;color:#888;margin-top:3px;font-family:'Space Mono',monospace">Navegar de cliente en cliente</div>
      </div>
      <button onclick="closeEnrutar()" style="background:#f0f0f0;border:none;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
    </div>

    <div style="margin-bottom:16px">
      <div style="font-size:10px;font-weight:700;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-family:'Space Mono',monospace">Punto de inicio</div>
      <label style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid var(--c);border-radius:10px;cursor:pointer;margin-bottom:6px;font-size:13px;font-weight:600;background:#fff8f5">
        <input type="radio" name="startOpt" value="gps" checked style="accent-color:var(--c);width:16px;height:16px"> 📍 Mi ubicación actual (GPS)
      </label>
      <label style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid #eee;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600">
        <input type="radio" name="startOpt" value="first" style="accent-color:var(--c);width:16px;height:16px"> 🏁 Primera parada de la ruta
      </label>
    </div>

    <div style="margin-bottom:18px">
      <div style="font-size:10px;font-weight:700;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-family:'Space Mono',monospace">Paradas incluidas</div>
      <div style="font-size:12px;color:#555;line-height:1.6;background:#f8f8f8;border-radius:8px;padding:10px 12px" id="enrutarPreview">—</div>
      <div style="font-size:10px;color:#aaa;margin-top:6px;font-family:'Space Mono',monospace">⚠ Google Maps permite máx. 10 paradas. Se tomarán las primeras 10 en orden.</div>
    </div>

    <button onclick="launchRoute()" style="width:100%;padding:14px;background:var(--c);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.02em">
      🚀 Abrir en Google Maps
    </button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tabMap" onclick="showTab('map')">🗺 Mapa</div>
  <div class="tab" id="tabList" onclick="showTab('list')">📋 Lista</div>
</div>

<div id="map"></div>

<div id="listView">
  <div class="search-wrap" id="searchWrap">
    <input type="text" id="searchBox" placeholder="🔍 Buscar por cualquier campo..." oninput="filterList(this.value)">
  </div>
  <div id="clientList"></div>
</div>

<script>
const ROUTE_COLOR = '#e63946';
const DATA = [{lat:1.20928,lng:-77.28981,name:"DOLLARCITY MIJITAYO",addr:"CR 26 241",order:"1",tel:"1234567890",notas:"",horario:"",codigo:"1224090921",extras:{"Preventa":"KA4V76","Reparto Antiguo":"KA4V50","Barrio":"CAPUSIGRA"}},
{lat:1.2062,lng:-77.2859,name:"CAFETERIA EXITO PASTO PANAMERI",addr:"CR 22B 2 57",order:"2",tel:"0",notas:"",horario:"",codigo:"1203704384",extras:{"Preventa":"KA4V01","Reparto Antiguo":"KA4V01","Barrio":"CAPUSIGRA"}},
{lat:1.211175,lng:-77.28303,name:"AUTOSERVICIO TIGRE SANTIAGO",addr:"KR 23 12 25 PARQUE SANTIAGO",order:"3",tel:"0",notas:"",horario:"",codigo:"1210276003",extras:{"Preventa":"KA4V66","Reparto Antiguo":"KA4V11","Barrio":"SANTIAGO"}},
{lat:1.2046,lng:-77.2752,name:"SUPERMERCADOS TIGRE DE LA REBA",addr:"CL 18 14 28",order:"4",tel:"3173484177",notas:"",horario:"",codigo:"1224557074",extras:{"Preventa":"KA4V66","Reparto Antiguo":"KA4V12","Barrio":"FATIMA"}},
{lat:1.2059,lng:-77.265,name:"METRO PASTO UNICO",addr:"CL 22 6 61 C.C UNICO",order:"5",tel:"0",notas:"",horario:"",codigo:"1210425530",extras:{"Preventa":"KA4V76","Reparto Antiguo":"KA4V01","Barrio":"CENTRO"}},
{lat:1.20567,lng:-77.26051,name:"DOLLARCITY UNICO PASTO",addr:"CL 22 661 CC UNICO",order:"6",tel:"1234567890",notas:"",horario:"",codigo:"1224090920",extras:{"Preventa":"KA4V76","Reparto Antiguo":"KA4V54","Barrio":"VILLAS FLOR"}},
{lat:1.212369,lng:-77.27746,name:"DOLLARCITY PASTO CENTRO",addr:"CL 18 21B 40",order:"7",tel:"1234567890",notas:"",horario:"",codigo:"1224090922",extras:{"Preventa":"KA4V76","Reparto Antiguo":"KA4V11","Barrio":"CENTRO"}},
{lat:1.216894,lng:-77.27764,name:"LA ECONOMIA DROGUERIA 10232 PA",addr:"CL 20 26 40 LC 1",order:"8",tel:"3173373867",notas:"",horario:"",codigo:"1224820515",extras:{"Preventa":"KA4V21","Reparto Antiguo":"KA4V11","Barrio":"CENTRO"}},
{lat:1.234135,lng:-77.28694,name:"RESTAURANTE MISTER POLLO",addr:"CR 44 B 19 56",order:"9",tel:"3104947167",notas:"",horario:"",codigo:"1200930371",extras:{"Preventa":"KA4V66","Reparto Antiguo":"KA4V56","Barrio":"PANDIACO"}},
{lat:1.2169,lng:-77.2894,name:"JUMBO PASTO UNICENTRO",addr:"AV PANAMERICANA ENTRE CL 11 12",order:"10",tel:"0",notas:"",horario:"",codigo:"1210425523",extras:{"Preventa":"KA4V01","Reparto Antiguo":"KA4V01","Barrio":"CENTRO"}},
{lat:1.21651,lng:-77.28858,name:"5135 VZ UNIPASTO CUEROS VELEZ",addr:"CL 11 34 78 CC UNICENTRO LC 2",order:"11",tel:"3103653539",notas:"",horario:"",codigo:"1224728543",extras:{"Preventa":"KA4V77","Reparto Antiguo":"KA4V50","Barrio":"CENTRO"}}];
const BUILD_TS = '1773168155868'; // fuerza recarga al cambiar contenido

// Forzar recarga si el contenido cambió
const stored = sessionStorage.getItem('map_ts_ka4v01');
if (stored && stored !== BUILD_TS) {
  sessionStorage.setItem('map_ts_ka4v01', BUILD_TS);
  location.reload(true);
} else {
  sessionStorage.setItem('map_ts_ka4v01', BUILD_TS);
}

// ── MAP ──
const map = L.map('map',{zoomControl:false}).setView([1.2126939090909092,-77.27995181818181],13);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);

function makeIcon(order){
  const n=order||'';
  const fs=String(n).length>2?8:10;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 42">
    <path d="M16 0C7.163 0 0 7.163 0 16c0 12 16 26 16 26S32 28 32 16C32 7.163 24.837 0 16 0z" fill="${ROUTE_COLOR}" filter="drop-shadow(0 2px 4px rgba(0,0,0,.3))"/>
    <circle cx="16" cy="16" r="9" fill="rgba(0,0,0,.2)"/>
    <text x="16" y="20.5" text-anchor="middle" font-size="${fs}" font-family="monospace" font-weight="700" fill="#fff">${n}</text>
  </svg>`;
  return L.divIcon({html:'<div>'+svg+'</div>',iconSize:[32,40],iconAnchor:[16,40],popupAnchor:[0,-42],className:''});
}

const markers=[];
DATA.forEach(c=>{
  const m=L.marker([c.lat,c.lng],{icon:makeIcon(c.order)});
  m.bindPopup(()=>{
    const extraRows = c.extras && Object.keys(c.extras).length
      ? '<div class="lp-extras">'+Object.entries(c.extras).map(([k,v])=>'<div class="lp-extra-row"><span class="lp-extra-label">'+k+'</span><span class="lp-extra-val">'+v+'</span></div>').join('')+'</div>'
      : '';
    return `<div class="lp-inner">
      <div>
        <span class="lp-badge">Parada ${c.order||'—'}</span>
        ${c.codigo?'<span class="lp-codigo">COD: '+c.codigo+'</span>':''}
      </div>
      <div class="lp-name">${c.name}</div>
      <div class="lp-addr">${c.addr||''}</div>
      ${c.horario?'<div class="lp-horario">🕐 '+c.horario+'</div>':''}
      <div class="lp-actions">
        <a class="lp-btn lp-btn-nav" href="https://maps.google.com/?q=${c.lat},${c.lng}" target="_blank">🧭 Navegar</a>
        ${c.tel?'<a class="lp-btn lp-btn-call" href="tel:'+c.tel+'">📞 Llamar</a>':''}
      </div>
      ${c.notas?'<div class="lp-notas">📝 '+c.notas+'</div>':''}
      ${extraRows}
    </div>`;
  });
  m.addTo(map);
  markers.push({marker:m,...c});
});

// fit bounds
if(DATA.length){
  const lats=DATA.map(c=>c.lat),lngs=DATA.map(c=>c.lng);
  map.fitBounds([[Math.min(...lats),Math.min(...lngs)],[Math.max(...lats),Math.max(...lngs)]],{padding:[40,40]});
}

// ── LIST ──
function renderList(items){
  document.getElementById('clientList').innerHTML=items.map(c=>`
    <div class="client-item" onclick="focusMarker(${c.lat},${c.lng})">
      <div class="client-num">${c.order||'?'}</div>
      <div style="flex:1;min-width:0">
        <div class="client-name">${c.name}</div>
        <div class="client-addr">${c.addr||''}</div>
        <div class="client-actions">
          <a class="btn-nav" href="https://maps.google.com/?q=${c.lat},${c.lng}" target="_blank">🧭 Navegar</a>
          ${c.tel?'<a class="btn-call" href="tel:'+c.tel+'">📞 '+c.tel+'</a>':''}
        </div>
        ${c.notas?'<div class="client-notas">📝 '+c.notas+'</div>':''}
      </div>
    </div>`).join('');
}
renderList(DATA);

function filterList(q){
  const f=q.toLowerCase().trim();
  if(!f){ renderList(DATA); return; }
  renderList(DATA.filter(c=>{
    // Campos fijos
    const fixed=[c.name,c.addr,c.order,c.codigo,c.horario,c.tel,c.notas]
      .map(v=>(v||'').toLowerCase()).join(' ');
    // Columnas extras del excel
    const extras=Object.values(c.extras||{}).map(v=>(v||'').toLowerCase()).join(' ');
    return (fixed+' '+extras).includes(f);
  }));
}

function focusMarker(lat,lng){
  showTab('map');
  map.setView([lat,lng],17);
  const m=markers.find(x=>x.lat===lat&&x.lng===lng);
  if(m)m.marker.openPopup();
}

// ── ENRUTAR ──
function openEnrutar(){
  // Ordenar por campo order, los que no tienen orden van al final
  const sorted=[...DATA].sort((a,b)=>{
    const na=parseInt(a.order)||9999, nb=parseInt(b.order)||9999;
    return na-nb;
  });
  const stops=sorted.slice(0,10);
  const preview=document.getElementById('enrutarPreview');
  preview.innerHTML=stops.map((c,i)=>
    '<div style="display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #eee">'
    +'<span style="font-family:monospace;font-size:10px;color:#aaa;min-width:18px">'+(i+1)+'.</span>'
    +'<span style="font-size:12px;font-weight:600">'+c.name+'</span>'
    +'<span style="font-size:11px;color:#888;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+c.addr+'</span>'
    +'</div>'
  ).join('')+(DATA.length>10?'<div style="font-size:10px;color:#e05000;margin-top:6px">+ '+(DATA.length-10)+' paradas no incluidas</div>':'');
  const modal=document.getElementById('modalEnrutar');
  modal.style.display='flex';
  modal.addEventListener('click', function handler(e){
    if(e.target===modal){ closeEnrutar(); modal.removeEventListener('click',handler); }
  });
}

function closeEnrutar(){
  document.getElementById('modalEnrutar').style.display='none';
}

function launchRoute(){
  const startOpt=document.querySelector('input[name="startOpt"]:checked').value;
  const sorted=[...DATA].sort((a,b)=>{
    const na=parseInt(a.order)||9999, nb=parseInt(b.order)||9999;
    return na-nb;
  });
  // Google Maps waypoints: máx 10 intermedios (12 total con origen y destino)
  const maxWaypoints=10;
  const stops=sorted.slice(0,maxWaypoints+1); // +1 para destino final
  const waypoints=stops.slice(0,-1); // intermedios
  const destination=stops[stops.length-1];

  const destStr=destination.lat+','+destination.lng;
  const waypointsStr=waypoints.map(c=>c.lat+','+c.lng).join('|');

  let url;
  if(startOpt==='gps'){
    // Origen = ubicación actual del GPS
    url='https://www.google.com/maps/dir/?api=1'
      +'&destination='+encodeURIComponent(destStr)
      +(waypointsStr?'&waypoints='+encodeURIComponent(waypointsStr):'')
      +'&travelmode=driving';
  } else {
    // Origen = primera parada
    const first=stops[0];
    const rest=stops.slice(1);
    const dest2=rest[rest.length-1];
    const wp2=rest.slice(0,-1).map(c=>c.lat+','+c.lng).join('|');
    url='https://www.google.com/maps/dir/?api=1'
      +'&origin='+encodeURIComponent(first.lat+','+first.lng)
      +'&destination='+encodeURIComponent(dest2.lat+','+dest2.lng)
      +(wp2?'&waypoints='+encodeURIComponent(wp2):'')
      +'&travelmode=driving';
  }
  window.open(url,'_blank');
  closeEnrutar();
}

// ── TABS ──
function showTab(tab){
  const isMap=tab==='map';
  document.getElementById('map').style.display=isMap?'block':'none';
  document.getElementById('listView').style.display=isMap?'none':'flex';
  document.getElementById('searchWrap').style.display=isMap?'none':'block';
  document.getElementById('tabMap').classList.toggle('active',isMap);
  document.getElementById('tabList').classList.toggle('active',!isMap);
  if(isMap)setTimeout(()=>map.invalidateSize(),50);
  else document.getElementById('listView').style.flexDirection='column';
}
</script>
</body>
</html>
