<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>KA4V56 · 10-03-2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c:#023e8a;--bg:#f5f2eb;--ink:#1a1814;--muted:#8c8680;--surface:#fff;--border:#e2ddd5}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:3px solid var(--c)}
.route-badge{background:var(--c);color:#fff;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;padding:4px 10px;border-radius:2px;letter-spacing:.04em;white-space:nowrap}
.topbar-info{flex:1;min-width:0}
.topbar-info h1{font-family:'Unbounded',sans-serif;font-size:13px;color:#fff;font-weight:700;line-height:1.2}
.topbar-info p{font-family:'Space Mono',monospace;font-size:9px;color:#888;margin-top:2px}
.counter{font-family:'Space Mono',monospace;font-size:11px;color:var(--c);text-align:right;white-space:nowrap}
.counter span{display:block;font-size:9px;color:#666;margin-top:1px}
.btn-enrutar{background:var(--c);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs{display:flex;background:var(--ink);flex-shrink:0;border-bottom:1px solid #333}
.tab{flex:1;padding:8px;text-align:center;font-size:11px;font-weight:600;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--c);border-bottom-color:var(--c)}
#map{flex:1;display:block}
#listView{flex:1;overflow-y:auto;display:none;flex-direction:column}
.search-wrap{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:none}
#searchBox{width:100%;border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;background:var(--bg)}
#searchBox:focus{border-color:var(--c)}
.client-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.client-item:active{background:#ece9e0}
.client-num{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.client-name{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:2px}
.client-addr{font-size:12px;color:var(--muted);line-height:1.4}
.client-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.btn-nav{display:inline-flex;align-items:center;gap:4px;background:var(--c);color:#fff;border:none;border-radius:3px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none}
.btn-call{background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:4px;border:none;border-radius:3px;padding:5px 10px;font-size:11px;font-weight:600;text-decoration:none}
.client-notas{font-size:11px;color:#c05000;background:#fff8f5;border-left:3px solid var(--c);padding:4px 8px;margin-top:6px;border-radius:0 3px 3px 0}
.lp-inner{padding:14px;min-width:200px;max-width:290px}
.lp-badge{display:inline-block;background:var(--c);color:#fff;font-size:9px;font-family:'Space Mono',monospace;padding:2px 6px;border-radius:2px;margin-bottom:6px;letter-spacing:.04em}
.lp-codigo{display:inline-block;background:#f0f0f0;color:#555;font-size:9px;font-family:'Space Mono',monospace;padding:2px 6px;border-radius:2px;margin-bottom:6px;margin-left:4px}
.lp-name{font-size:15px;font-weight:700;margin-bottom:3px;line-height:1.3}
.lp-addr{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.lp-horario{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#1a6640;background:#e8f7ee;border-radius:3px;padding:3px 8px;margin-bottom:8px}
.lp-actions{display:flex;gap:6px;flex-wrap:wrap}
.lp-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:3px;font-size:12px;font-weight:600;border:none;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif}
.lp-btn-nav{background:#023e8a;color:#fff}
.lp-btn-call{background:#1a1814;color:#fff}
.lp-notas{font-size:11px;color:#c05000;background:#fff8f5;border-left:3px solid #023e8a;padding:5px 8px;margin-top:8px;border-radius:0 3px 3px 0;line-height:1.4}
.lp-extras{margin-top:8px;border-top:1px solid #eee;padding-top:8px;display:flex;flex-direction:column;gap:4px}
.lp-extra-row{display:flex;gap:6px;font-size:11px}
.lp-extra-label{font-family:'Space Mono',monospace;font-size:9px;color:#888;min-width:70px;text-transform:uppercase}
.lp-extra-val{font-weight:600;color:#1a1814;flex:1}
.leaflet-popup-content-wrapper{background:#fff!important;border:none!important;border-radius:8px!important;box-shadow:0 8px 32px rgba(0,0,0,.18)!important;padding:0!important}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-tip-container{display:none}
.leaflet-control-zoom a{background:var(--ink)!important;color:#fff!important;border:none!important;border-radius:4px!important;margin-bottom:4px!important}
</style>
</head>
<body>

<div class="topbar">
  <div class="route-badge">KA4V56</div>
  <div class="topbar-info">
    <h1>Mapa del día</h1>
    <p>MARTES, 10 DE MARZO DE 2026</p>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
    <div class="counter">4<span>clientes</span></div>
    <button class="btn-enrutar" onclick="openEnrutar()">🗺 Enrutar</button>
  </div>
</div>

<!-- MODAL ENRUTAR -->
<div id="modalEnrutar" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;align-items:flex-end;justify-content:center">
  <div style="background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 20px 32px;max-height:85vh;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700">Enrutar en Google Maps</div>
        <div style="font-size:11px;color:#888;margin-top:3px;font-family:'Space Mono',monospace">Navegar de cliente en cliente</div>
      </div>
      <button onclick="closeEnrutar()" style="background:#f0f0f0;border:none;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer">✕</button>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:10px;font-weight:700;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-family:'Space Mono',monospace">Punto de inicio</div>
      <label style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid var(--c);border-radius:10px;cursor:pointer;margin-bottom:6px;font-size:13px;font-weight:600;background:#fff8f5">
        <input type="radio" name="startOpt" value="gps" checked style="accent-color:var(--c);width:16px;height:16px"> 📍 Mi ubicación actual (GPS)
      </label>
      <label style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid #eee;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600">
        <input type="radio" name="startOpt" value="first" style="accent-color:var(--c);width:16px;height:16px"> 🏁 Primera parada de la ruta
      </label>
    </div>
    <div style="margin-bottom:4px">
      <div style="font-size:10px;font-weight:700;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-family:'Space Mono',monospace">Bloques de ruta — toca cada uno en orden</div>
      <div id="enrutarPreview" style="max-height:50vh;overflow-y:auto">—</div>
      <div style="font-size:10px;color:#aaa;margin-top:8px;font-family:monospace;line-height:1.5">Cada bloque tiene hasta 9 paradas. Termina uno y abre el siguiente.</div>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tabMap" onclick="showTab('map')">🗺 Mapa</div>
  <div class="tab" id="tabList" onclick="showTab('list')">📋 Lista</div>
</div>
<div id="map"></div>
<div id="listView">
  <div class="search-wrap" id="searchWrap">
    <input type="text" id="searchBox" placeholder="🔍 Buscar por cualquier campo..." oninput="filterList(this.value)">
  </div>
  <div id="clientList"></div>
</div>

<script>
const ROUTE_COLOR='#023e8a';
const DATA=[{lat:1.165373,lng:-77.29318,name:"PUNTO DEL AHORRO",addr:"CL PRINCIPAL CATAMBUCO",order:"1",tel:"3102265319",notas:"",horario:"",codigo:"1224461531",extras:{"Preventa":"KA4V04","Reparto Antiguo":"KA4V01","Barrio":"CATAMBUCO"}},
{lat:1.166705,lng:-77.29981,name:"RESTAURANTE CON 2",addr:"CL 4 5 36",order:"2",tel:"3166263455",notas:"",horario:"",codigo:"1224820739",extras:{"Preventa":"KA4V04","Reparto Antiguo":"KA4V01","Barrio":"CATAMBUCO"}},
{lat:1.3234,lng:-77.1995,name:"TIENDA TIA MAGOLA",addr:"CA 10 AV PRINCIPAL VILLA MOREN",order:"3",tel:"3234853556",notas:"",horario:"",codigo:"1224377769",extras:{"Preventa":"KA4V03","Reparto Antiguo":"KA4V01","Barrio":"OTROS"}},
{lat:1.358627,lng:-77.28258,name:"BAN AGRARIO CHACHAGUI",addr:"CL 3 4 71",order:"4",tel:"3152438149",notas:"",horario:"",codigo:"1224804649",extras:{"Preventa":"KA4V23","Reparto Antiguo":"KA4V56","Barrio":"CENTRO"}}];
const BUILD_TS='1773174855251';
const stored=sessionStorage.getItem('map_ts_ka4v56');
if(stored && stored!==BUILD_TS){ sessionStorage.setItem('map_ts_ka4v56',BUILD_TS); location.reload(true); }
else{ sessionStorage.setItem('map_ts_ka4v56',BUILD_TS); }

const map=L.map('map',{zoomControl:false}).setView([1.25352625,-77.2687675],13);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);

function makeIcon(order){
  var n=order||'',fs=String(n).length>2?8:10;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 42"><path d="M16 0C7.163 0 0 7.163 0 16c0 12 16 26 16 26S32 28 32 16C32 7.163 24.837 0 16 0z" fill="'+ROUTE_COLOR+'" filter="drop-shadow(0 2px 4px rgba(0,0,0,.3))"/><circle cx="16" cy="16" r="9" fill="rgba(0,0,0,.2)"/><text x="16" y="20.5" text-anchor="middle" font-size="'+fs+'" font-family="monospace" font-weight="700" fill="#fff">'+n+'</text></svg>';
  return L.divIcon({html:'<div>'+svg+'</div>',iconSize:[32,40],iconAnchor:[16,40],popupAnchor:[0,-42],className:''});
}

var markers=[];
DATA.forEach(function(c){
  var m=L.marker([c.lat,c.lng],{icon:makeIcon(c.order)});
  m.bindPopup(function(){
    var extraRows=c.extras&&Object.keys(c.extras).length
      ?'<div class="lp-extras">'+Object.entries(c.extras).map(function(e){return '<div class="lp-extra-row"><span class="lp-extra-label">'+e[0]+'</span><span class="lp-extra-val">'+e[1]+'</span></div>';}).join('')+'</div>':'';
    return '<div class="lp-inner">'
      +'<div><span class="lp-badge">Parada '+(c.order||'—')+'</span>'+(c.codigo?'<span class="lp-codigo">COD: '+c.codigo+'</span>':'')+'</div>'
      +'<div class="lp-name">'+c.name+'</div>'
      +'<div class="lp-addr">'+(c.addr||'')+'</div>'
      +(c.horario?'<div class="lp-horario">🕐 '+c.horario+'</div>':'')
      +'<div class="lp-actions">'
      +'<a class="lp-btn lp-btn-nav" href="https://maps.google.com/?q='+c.lat+','+c.lng+'" target="_blank">🧭 Navegar</a>'
      +(c.tel?'<a class="lp-btn lp-btn-call" href="tel:'+c.tel+'">📞 Llamar</a>':'')
      +'</div>'
      +(c.notas?'<div class="lp-notas">📝 '+c.notas+'</div>':'')
      +extraRows+'</div>';
  });
  m.addTo(map);
  markers.push({marker:m,data:c});
});

if(DATA.length){
  var lats=DATA.map(function(c){return c.lat;}),lngs=DATA.map(function(c){return c.lng;});
  map.fitBounds([[Math.min.apply(null,lats),Math.min.apply(null,lngs)],[Math.max.apply(null,lats),Math.max.apply(null,lngs)]],{padding:[40,40]});
}

function renderList(items){
  document.getElementById('clientList').innerHTML=items.map(function(c){
    return '<div class="client-item" onclick="focusMarker('+c.lat+','+c.lng+')">'
      +'<div class="client-num">'+(c.order||'?')+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="client-name">'+c.name+'</div>'
      +'<div class="client-addr">'+(c.addr||'')+'</div>'
      +'<div class="client-actions">'
      +'<a class="btn-nav" href="https://maps.google.com/?q='+c.lat+','+c.lng+'" target="_blank">🧭 Navegar</a>'
      +(c.tel?'<a class="btn-call" href="tel:'+c.tel+'">📞 '+c.tel+'</a>':'')
      +'</div>'
      +(c.notas?'<div class="client-notas">📝 '+c.notas+'</div>':'')
      +'</div></div>';
  }).join('');
}
renderList(DATA);

function filterList(q){
  var f=q.toLowerCase().trim();
  if(!f){renderList(DATA);return;}
  renderList(DATA.filter(function(c){
    var fixed=[c.name,c.addr,c.order,c.codigo,c.horario,c.tel,c.notas].map(function(v){return (v||'').toLowerCase();}).join(' ');
    var extras=Object.values(c.extras||{}).map(function(v){return (v||'').toLowerCase();}).join(' ');
    return (fixed+' '+extras).includes(f);
  }));
}

function focusMarker(lat,lng){
  showTab('map');
  map.setView([lat,lng],17);
  var found=markers.find(function(x){return x.data.lat===lat&&x.data.lng===lng;});
  if(found)found.marker.openPopup();
}

function showTab(tab){
  var isMap=tab==='map';
  document.getElementById('map').style.display=isMap?'block':'none';
  document.getElementById('listView').style.display=isMap?'none':'flex';
  document.getElementById('searchWrap').style.display=isMap?'none':'block';
  document.getElementById('tabMap').classList.toggle('active',isMap);
  document.getElementById('tabList').classList.toggle('active',!isMap);
  if(isMap)setTimeout(function(){map.invalidateSize();},50);
}

// ENRUTAR
var BLOCK_SIZE=9;
function buildBlocks(startOpt){
  var sorted=DATA.slice().sort(function(a,b){return (parseInt(a.order)||9999)-(parseInt(b.order)||9999);});
  var blocks=[];
  for(var i=0;i<sorted.length;i+=BLOCK_SIZE) blocks.push(sorted.slice(i,i+BLOCK_SIZE));
  return blocks.map(function(chunk,bi){
    var origin,waypoints,destination;
    if(bi===0&&startOpt==='gps'){ origin=null; waypoints=chunk.slice(0,-1); destination=chunk[chunk.length-1]; }
    else if(bi===0&&startOpt==='first'){ origin=chunk[0]; waypoints=chunk.slice(1,-1); destination=chunk[chunk.length-1]; }
    else { origin=blocks[bi-1][blocks[bi-1].length-1]; waypoints=chunk.slice(0,-1); destination=chunk[chunk.length-1]; }
    var destCoord=destination.lat+','+destination.lng;
    var wpCoords=waypoints.map(function(c){return c.lat+','+c.lng;}).join('|');
    var url='https://www.google.com/maps/dir/?api=1'
      +(origin?'&origin='+encodeURIComponent(origin.lat+','+origin.lng):'')
      +'&destination='+encodeURIComponent(destCoord)
      +(wpCoords?'&waypoints='+encodeURIComponent(wpCoords):'')
      +'&travelmode=driving';
    var gs=bi*BLOCK_SIZE+1, ge=Math.min((bi+1)*BLOCK_SIZE,sorted.length);
    return {url:url,label:'Bloque '+(bi+1),range:'Paradas '+gs+'–'+ge,last:destination};
  });
}

function openEnrutar(){
  var startOpt=document.querySelector('input[name="startOpt"]:checked').value;
  var blocks=buildBlocks(startOpt);
  window._routeBlocks=blocks;
  document.getElementById('enrutarPreview').innerHTML=blocks.map(function(b,i){
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;cursor:pointer" onclick="launchBlock('+i+')">'
      +'<div style="width:32px;height:32px;border-radius:50%;background:'+ROUTE_COLOR+';color:#fff;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:12px;font-weight:700;flex-shrink:0">'+(i+1)+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:13px;font-weight:700">'+b.label+' <span style="font-size:10px;color:#888;font-family:monospace">'+b.range+'</span></div>'
      +'<div style="font-size:11px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Hasta: '+b.last.name+'</div>'
      +'</div>'
      +'<div style="background:'+ROUTE_COLOR+';color:#fff;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;flex-shrink:0">Abrir →</div>'
      +'</div>';
  }).join('');
  var modal=document.getElementById('modalEnrutar');
  modal.style.display='flex';
  modal.onclick=function(e){if(e.target===modal)closeEnrutar();};
}

document.querySelectorAll('input[name="startOpt"]').forEach(function(r){
  r.addEventListener('change',function(){ if(document.getElementById('modalEnrutar').style.display==='flex') openEnrutar(); });
});

function closeEnrutar(){ document.getElementById('modalEnrutar').style.display='none'; }
function launchBlock(idx){ var b=(window._routeBlocks||[])[idx]; if(b)window.open(b.url,'_blank'); }
</script>
</body>
</html>
