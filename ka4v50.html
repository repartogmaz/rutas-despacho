      +(c.codigo?"<div style='font-family:monospace;font-size:10px;color:#888;margin-top:2px'>COD: "+c.codigo+"</div>":"")
      +"<div class='ca'>"

      +(c.tel?"<a class='bc' href='tel:"+c.tel+"'>&#x1F4DE; "+c.tel+"</a>":"")
      +"</div>"
      +(c.notas?"<div class='nt'>&#x1F4DD; "+c.notas+"</div>":"")
      +"</div></div>";
  }).join("");
}
rl(D);
function fl(q){
  var f=q.toLowerCase().trim();

  rl(D.filter(function(c){
    var t=[c.name,c.addr,c.order,c.codigo,c.horario,c.tel,c.notas].map(function(v){return(v||"").toLowerCase();}).join(" ");
    var x=Object.values(c.extras||{}).map(function(v){return(v||"").toLowerCase();}).join(" ");
    return(t+" "+x).includes(f);

}

function sw(tab){
  document.getElementById("map").style.display=tab==="m"?"block":"none";

  document.getElementById("rv").style.display=tab==="r"?"flex":"none";

  document.getElementById("tR").className="tab"+(tab==="r"?" on":"");

  if(tab==="r")rr();
}
function sest(k,s){
  var now=new Date().toLocaleTimeString("es-CL");
  E[k]={s:s,h:now};sE();
  var f=MK.find(function(x){return x.k===k;});
  if(f){f.m.setIcon(mi(f.d.order,s));f.m.closePopup();setTimeout(function(){f.m.openPopup();},100);}
  if(document.getElementById("lv").style.display!=="none")rl(D);
}
function rr(){
  var tot=D.length;
  var ne=D.filter(function(c){var sv=E[ck(c)];return sv&&sv.s==="e";}).length;
  var nrt=D.filter(function(c){var sv=E[ck(c)];return sv&&sv.s==="rt";}).length;
  var nrp=D.filter(function(c){var sv=E[ck(c)];return sv&&sv.s==="rp";}).length;
  var np=tot-ne-nrt-nrp;
  var pct=Math.round((ne/tot)*100);
  document.getElementById("rs").innerHTML=
    '<div style="background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;border:1px solid #e2ddd5">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:12px">Resumen del d\u00eda</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    +'<div style="background:#f0fdf4;border-radius:8px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#15803d">'+ne+'</div><div style="font-size:10px;color:#15803d;font-weight:600">ENTREGADOS</div></div>'
    +'<div style="background:#fef2f2;border-radius:8px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#b91c1c">'+nrt+'</div><div style="font-size:10px;color:#b91c1c;font-weight:600">RECHAZO TOTAL</div></div>'
    +'<div style="background:#fffbeb;border-radius:8px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#b45309">'+nrp+'</div><div style="font-size:10px;color:#b45309;font-weight:600">RECHAZO PARCIAL</div></div>'
    +'<div style="background:#f9fafb;border-radius:8px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#6b7280">'+np+'</div><div style="font-size:10px;color:#6b7280;font-weight:600">PENDIENTES</div></div>'
    +'</div>'
    +'<div style="margin-top:12px;background:#f0f0f0;border-radius:20px;height:8px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:#22c55e;border-radius:20px"></div></div>'
    +'<div style="font-size:11px;color:#888;text-align:center;margin-top:4px">'+pct+'% ('+tot+' clientes)</div>'
    +'</div>';
  var rows=D.map(function(c){
    var k2=ck(c),sv=E[k2]||{};
    var st=sv.s||"p";
    var sl=st==="e"?"Entregado":st==="rt"?"Rechazo Total":st==="rp"?"Rechazo Parcial":"Pendiente";
    var bg=st==="e"?"#f0fdf4":st==="rt"?"#fef2f2":st==="rp"?"#fffbeb":"#fff";
    var col=st==="e"?"#15803d":st==="rt"?"#b91c1c":st==="rp"?"#b45309":"#9ca3af";
    return '<div style="background:'+bg+';border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px">'
      +'<div style="width:8px;height:8px;border-radius:50%;background:'+col+';flex-shrink:0"></div>'
      +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+c.name+'</div>'
      +(c.codigo?'<div style="font-size:10px;color:#888;font-family:monospace">COD: '+c.codigo+'</div>':'')+'</div>'
      +'<div style="font-size:11px;font-weight:700;color:'+col+';text-align:right;flex-shrink:0">'+sl+(sv.h?'<div style="font-size:9px;font-weight:400;color:#aaa">'+sv.h+'</div>':'')+'</div>'
      +'</div>';
  }).join("");
  document.getElementById("rd").innerHTML='<div style="font-size:11px;font-weight:700;color:#8c8680;margin-bottom:8px">DETALLE POR CLIENTE</div>'+rows;
}
function dlr(){
  var lines=["Cliente,Codigo,Direccion,Orden,Estado,Hora"];
  D.forEach(function(c){
    var sv=E[ck(c)]||{};
    var st=sv.s||"";
    var sl=st==="e"?"Entregado":st==="rt"?"Rechazo Total":st==="rp"?"Rechazo Parcial":"Pendiente";
    lines.push([c.name,c.codigo||"",c.addr||"",c.order||"",sl,sv.h||""]
      .map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(","));
  });
  var a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,\uFEFF"+encodeURIComponent(lines.join("\n"));
  a.download="reporte_ka4v50_"+new Date().toLocaleDateString("es-CL").replace(/\//g,"-")+".csv";
  a.click();
}
