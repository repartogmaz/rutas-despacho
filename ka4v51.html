function makeIcon(order){
  var n=order||'',fs=String(n).length>2?8:10;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 42"><path d="M16 0C7.163 0 0 7.163 0 16c0 12 16 26 16 26S32 28 32 16C32 7.163 24.837 0 16 0z" fill="'+ROUTE_COLOR+'" filter="drop-shadow(0 2px 4px rgba(0,0,0,.3))"/><circle cx="16" cy="16" r="9" fill="rgba(0,0,0,.2)"/><text x="16" y="20.5" text-anchor="middle" font-size="'+fs+'" font-family="monospace" font-weight="700" fill="#fff">'+n+'</text></svg>';
  return L.divIcon({html:'<div>'+svg+'</div>',iconSize:[32,40],iconAnchor:[16,40],popupAnchor:[0,-42],className:''});
}

var markers=[];
DATA.forEach(function(c){
  var m=L.marker([c.lat,c.lng],{icon:makeIcon(c.order)});
  m.bindPopup(function(){
    var extraRows=c.extras&&Object.keys(c.extras).length
      ?'<div class="lp-extras">'+Object.entries(c.extras).map(function(e){return '<div class="lp-extra-row"><span class="lp-extra-label">'+e[0]+'</span><span class="lp-extra-val">'+e[1]+'</span></div>';}).join('')+'</div>':'';
    return '<div class="lp-inner">'
      +'<div><span class="lp-badge">Parada '+(c.order||'—')+'</span>'+(c.codigo?'<span class="lp-codigo">COD: '+c.codigo+'</span>':'')+'</div>'
      +'<div class="lp-name">'+c.name+'</div>'
      +'<div class="lp-addr">'+(c.addr||'')+'</div>'
      +(c.horario?'<div class="lp-horario">🕐 '+c.horario+'</div>':'')
      +'<div class="lp-actions">'
      +'<a class="lp-btn lp-btn-nav" href="https://maps.google.com/?q='+c.lat+','+c.lng+'" target="_blank">🧭 Navegar</a>'
      +(c.tel?'<a class="lp-btn lp-btn-call" href="tel:'+c.tel+'">📞 Llamar</a>':'')
      +'</div>'
      +(c.notas?'<div class="lp-notas">📝 '+c.notas+'</div>':'')
      +extraRows+'</div>';
  });
  m.addTo(map);
  markers.push({marker:m,data:c});
});

if(DATA.length){
  var lats=DATA.map(function(c){return c.lat;}),lngs=DATA.map(function(c){return c.lng;});
  map.fitBounds([[Math.min.apply(null,lats),Math.min.apply(null,lngs)],[Math.max.apply(null,lats),Math.max.apply(null,lngs)]],{padding:[40,40]});
}

function renderList(items){
  document.getElementById('clientList').innerHTML=items.map(function(c){
    return '<div class="client-item" onclick="focusMarker('+c.lat+','+c.lng+')">'
      +'<div class="client-num">'+(c.order||'?')+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="client-name">'+c.name+'</div>'
      +'<div class="client-addr">'+(c.addr||'')+'</div>'+( c.codigo ? '<div style="font-family:monospace;font-size:10px;color:#888;margin-top:2px">COD: '+c.codigo+'</div>' : '' )
      +'<div class="client-actions">'
      +'<a class="btn-nav" href="https://maps.google.com/?q='+c.lat+','+c.lng+'" target="_blank">🧭 Navegar</a>'
      +(c.tel?'<a class="btn-call" href="tel:'+c.tel+'">📞 '+c.tel+'</a>':'')
      +'</div>'
      +(c.notas?'<div class="client-notas">📝 '+c.notas+'</div>':'')
      +'</div></div>';
  }).join('');
}
renderList(DATA);

function filterList(q){
  var f=q.toLowerCase().trim();
  if(!f){renderList(DATA);return;}
  renderList(DATA.filter(function(c){
    var fixed=[c.name,c.addr,c.order,c.codigo,c.horario,c.tel,c.notas].map(function(v){return (v||'').toLowerCase();}).join(' ');
    var extras=Object.values(c.extras||{}).map(function(v){return (v||'').toLowerCase();}).join(' ');
    return (fixed+' '+extras).includes(f);
  }));
}

function focusMarker(lat,lng){
  showTab('map');
  map.setView([lat,lng],17);
  var found=markers.find(function(x){return x.data.lat===lat&&x.data.lng===lng;});
  if(found)found.marker.openPopup();
}

function showTab(tab){
  var isMap=tab==='map';
  document.getElementById('map').style.display=isMap?'block':'none';
  document.getElementById('listView').style.display=isMap?'none':'flex';
  document.getElementById('searchWrap').style.display=isMap?'none':'block';
  document.getElementById('tabMap').classList.toggle('active',isMap);
  document.getElementById('tabList').classList.toggle('active',!isMap);
  if(isMap)setTimeout(function(){map.invalidateSize();},50);
}

</script>
