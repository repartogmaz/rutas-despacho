  header {

    padding: 10px 18px;

    gap: 14px;
    flex-shrink: 0;
    box-shadow: var(--sombra);
    z-index: 1000;
  }
  .logo-gmaz {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #fff;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .logo-gmaz span { color: rgba(255,255,255,.6); font-weight: 400; font-size: 13px; display: block; letter-spacing: .5px; }
  .divider-v { width: 1px; height: 34px; background: rgba(255,255,255,.3); }
  .ruta-badge {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 4px 12px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .counter {
    margin-left: auto;
    color: rgba(255,255,255,.85);
    font-size: 13px;
    white-space: nowrap;
  }
  #count-visible { font-weight: 700; color: #fff; font-size: 16px; }

  /* SEARCH BAR */
  .search-bar {
    background: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    border-bottom: 1px solid #e8e8e8;
    position: relative;
  }
  .search-icon { color: #aaa; font-size: 16px; flex-shrink: 0; }
  #search-input {
    flex: 1;
    border: 2px solid #ddd;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    min-width: 0;
  }
  #search-input:focus { border-color: var(--rojo); }
  #search-clear {
    background: none;
    border: none;
    cursor: pointer;
    color: #aaa;
    font-size: 18px;
    padding: 2px 6px;
    display: none;
    flex-shrink: 0;
  }
  #search-clear:hover { color: var(--rojo); }

  /* AUTOCOMPLETE DROPDOWN */
  #search-results {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-top: none;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    z-index: 2000;
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }
  .sr-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: background .1s;
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover, .sr-item.highlighted { background: #fff5f5; }
  .sr-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--negro);
  }
  .sr-name mark {
    background: #ffd0d0;
    color: var(--rojo);
    border-radius: 2px;
    padding: 0 1px;
  }
  .sr-sub { font-size: 11px; color: #888; }
  .sr-badge {
    display: inline-block;
    background: var(--rojo);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
  }
  .sr-empty { padding: 14px 16px; color: #aaa; font-size: 13px; text-align: center; }

  /* FILTER BAR */
  .filter-bar {
    background: #f9f9f9;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    border-bottom: 2px solid #e8e8e8;
    flex-wrap: wrap;

  .filter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;

  .qbtn:hover, .qbtn.active {

  if (!f) return '#888';
  const fu = f.toUpperCase();
  if (fu === 'L') return '#2ecc71';
  if (fu === 'M') return '#3498db';
  if (fu === 'J') return '#9b59b6';
  if (fu === 'V') return '#e67e22';
  if (fu === 'S') return '#f39c12';
  if (fu === 'R') return '#D91E2A';
  return '#1abc9c';
}

function buildPopup(c) {
  const tel = c.cel && c.cel !== '0' ? c.cel : (c.tel1 && c.tel1 !== '0' ? c.tel1 : c.tel_contacto);
  const telLink = tel && tel !== '0' ? `<a href="tel:${tel}" class="popup-tel">${tel}</a>` : '—';
  const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving`;
  const svUrl  = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${c.lat},${c.lng}&heading=0&pitch=0&fov=90`;
  return `
    <div class="popup-card">
      <div class="popup-name">${c.nombre}</div>
      <div class="popup-row"><span class="popup-icon">📍</span><span>${c.direccion}</span></div>
      <div class="popup-row"><span class="popup-icon">🏘</span><span>${c.barrio && c.barrio !== '0' ? c.barrio : '—'}</span></div>
      <div class="popup-row"><span class="popup-icon">📅</span><span>Frecuencia: <strong class="popup-badge">${c.frecuencia}</strong></span></div>
      <div class="popup-row"><span class="popup-icon">📞</span><span>${telLink}</span></div>
      <div class="popup-row" style="color:#aaa;font-size:11px"><span class="popup-icon">🔢</span><span>${c.codigo}</span></div>
      <div class="popup-actions">
        <a href="${navUrl}" target="_blank" class="popup-btn popup-btn-nav">🧭 Navegar</a>
        <a href="${svUrl}"  target="_blank" class="popup-btn popup-btn-sv">🏙 Street View</a>
      </div>
    </div>`;
}

// ── Marcadores ────────────────────────────────────────────
const markers = [];
CLIENTES.forEach(c => {
  if (!c.lat || !c.lng || isNaN(c.lat) || isNaN(c.lng)) return;
  const m = L.marker([c.lat, c.lng], {
    icon: makeIcon(freqColor(c.frecuencia)),
    title: c.nombre
  }).bindPopup(buildPopup(c), { maxWidth: 310 });
  m._clientData = c;
  m._baseColor = freqColor(c.frecuencia);
  markers.push(m);
  m.addTo(map);
});

function updateCount(n) {
  document.getElementById('count-visible').textContent = n;
}

// ── Filtro por frecuencia ────────────────────────────────
let currentFreq = '';
function applyFilter(q) {
  currentFreq = q.trim().toUpperCase();
  let visible = 0;
  markers.forEach(m => {
    const freq = (m._clientData.frecuencia || '').toUpperCase();
    const match = !currentFreq || freq.includes(currentFreq);
    if (match) { if (!map.hasLayer(m)) m.addTo(map); visible++; }
    else        { if (map.hasLayer(m)) map.removeLayer(m); }
  });
  updateCount(visible);
  document.querySelectorAll('.qbtn').forEach(b => {
    const bt = b.textContent.trim().toUpperCase();
    b.classList.toggle('active', bt === currentFreq || (currentFreq === '' && bt === 'TODOS'));
  });
}

document.getElementById('freq-input').addEventListener('input', function() {
  applyFilter(this.value);
});
function setFreq(v) {
  document.getElementById('freq-input').value = v;
  applyFilter(v);
}

// ── Buscador ─────────────────────────────────────────────
const searchInput   = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const searchClear   = document.getElementById('search-clear');
let highlightedIndex = -1;
let lastHighlighted  = null;

function normalize(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
}

function highlightText(text, query) {
  const nText  = normalize(text);
  const nQuery = normalize(query);
  const idx    = nText.indexOf(nQuery);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
}

function doSearch(q) {
  searchClear.style.display = q ? 'block' : 'none';
  if (!q || q.length < 1) { closeResults(); return; }
  const nq = normalize(q);
  const results = CLIENTES.filter(c =>
    normalize(c.nombre).includes(nq) || c.codigo.includes(q)
  ).slice(0, 8);

  if (results.length === 0) {
    searchResults.innerHTML = '<div class="sr-empty">Sin resultados</div>';
    searchResults.style.display = 'block';
    return;
  }
  searchResults.innerHTML = results.map((c, i) => `
    <div class="sr-item" data-idx="${i}" onclick="selectClient('${c.codigo}')">
      <div class="sr-name">${highlightText(c.nombre, q)} <span class="sr-badge">${c.frecuencia}</span></div>
      <div class="sr-sub">${c.codigo} · ${c.barrio && c.barrio !== '0' ? c.barrio : c.direccion.slice(0,30)}</div>
    </div>`).join('');
  searchResults.style.display = 'block';
  highlightedIndex = -1;
  // store result codes for keyboard nav
  searchResults._results = results;
}

searchInput.addEventListener('input', function() {
  doSearch(this.value.trim());
});

searchInput.addEventListener('keydown', function(e) {
  const items = searchResults.querySelectorAll('.sr-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, 0);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (highlightedIndex >= 0) items[highlightedIndex].click();
    else if (items.length === 1) items[0].click();
    return;
  } else if (e.key === 'Escape') {
    closeResults(); return;
  }
  items.forEach((it, i) => it.classList.toggle('highlighted', i === highlightedIndex));
});

function selectClient(codigo) {
  const c = CLIENTES.find(x => x.codigo === codigo);
  if (!c) return;
  closeResults();
  searchInput.value = c.nombre;
  searchClear.style.display = 'block';

  // restore previous highlight
  if (lastHighlighted) {
    lastHighlighted.setIcon(makeIcon(lastHighlighted._baseColor));
    lastHighlighted.setZIndexOffset(0);
  }

  // find the marker
  const m = markers.find(x => x._clientData.codigo === codigo);
  if (!m) return;

  // make sure it's visible regardless of freq filter
  if (!map.hasLayer(m)) m.addTo(map);

  // zoom & highlight
  map.setView([c.lat, c.lng], 18, { animate: true });
  m.setIcon(makeIconHighlight(m._baseColor));
  m.setZIndexOffset(1000);
  m.openPopup();
  lastHighlighted = m;
}

function clearSearch() {
  searchInput.value = '';
  searchClear.style.display = 'none';
  closeResults();
  if (lastHighlighted) {
    lastHighlighted.setIcon(makeIcon(lastHighlighted._baseColor));
    lastHighlighted.setZIndexOffset(0);
    lastHighlighted = null;
  }
  // reapply frequency filter to restore visibility
  applyFilter(currentFreq);
}

function closeResults() {
  searchResults.style.display = 'none';
  searchResults.innerHTML = '';
  highlightedIndex = -1;
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-bar')) closeResults();
});

// ── Geolocalización ───────────────────────────────────────
let myMarker = null;
function centerOnMe() {
  if (!navigator.geolocation) { showToast('Tu navegador no soporta geolocalización'); return; }
  showToast('Obteniendo ubicación…');
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if (myMarker) myMarker.remove();
    myMarker = L.marker([lat, lng], { icon: myIcon, zIndexOffset: 1000 })
      .bindPopup('<b>📍 Tu ubicación</b>').addTo(map);
    map.setView([lat, lng], 16);
    showToast('¡Ubicación encontrada!');
  }, () => showToast('No se pudo obtener la ubicación'),
  { enableHighAccuracy: true, timeout: 10000 });
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 2500);
}
</script>

</body></html>
